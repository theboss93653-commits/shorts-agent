name: Shorts

on:
  schedule:
    - cron: "0 16 * * *"   # tous les jours à 16:00 UTC
  workflow_dispatch:        # bouton "Run workflow" pour tester à la main

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Générer et publier un short
        run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          NICHE: "faits insolites sur la science"
          PRIVACY: "private"   # passe à "public" quand tu fais confiance au résultat

      - name: Sauvegarder l'historique des sujets
        run: |
          git config user.name "shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add used_topics.json
          git commit -m "maj sujets" || exit 0
          git push
